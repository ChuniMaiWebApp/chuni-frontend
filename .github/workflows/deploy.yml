name: CI/CD — chuni-frontend

on:
  push:
    # Both, because the repos were first pushed to `master`. Renaming later
    # needs no change here.
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # `lint:ci` has --max-warnings 0 and no --fix. The plain `lint` script
      # rewrites files, which on a CI runner means the job repairs its own
      # findings and always passes.
      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Run the deploy script over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Nuxt builds on the VPS, and the rollback path builds a second time.
          command_timeout: 20m
          script: |
            set -e
            cd /home/repo/ChuniMaiWebApp/chuni-frontend
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            git fetch --prune origin
            git checkout "origin/${{ github.ref_name }}" -- scripts/deploy.sh
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

  notify:
    name: Telegram
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ needs.deploy.result == 'success' && '🚀 *WEB DEPLOY THÀNH CÔNG*' || (needs.ci.result != 'success' && '🧪 *WEB — CI THẤT BẠI, chưa deploy*' || '❌ *WEB DEPLOY THẤT BẠI*') }}
            ────────────────────
            *Repo:* `chuni-frontend`
            *Author:* ${{ github.actor }}
            *Commit:* [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            *Message:* ${{ github.event.head_commit.message || 'manual run' }}
            ────────────────────
            *CI:* ${{ needs.ci.result }} · *Deploy:* ${{ needs.deploy.result }}
            ${{ needs.deploy.result == 'success' && '✅ https://chunithm-app.novaseele.com' || format('🔎 Log: https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
